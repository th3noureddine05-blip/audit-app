<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One Mobility - Audit System V32</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --om-orange: #e67e22; --om-blue: #2c3e50; --success: #27ae60; --danger: #c0392b; --bg: #f4f7f6; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #333; }
        .hidden { display: none !important; }
        header { background: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--om-orange); position: sticky; top: 0; z-index: 100; }
        .container { padding: 15px; max-width: 1000px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 15px; }
        #home-view { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #2c3e50, #000); color: white; text-align: center; }
        .main-btn { border: 2px solid var(--om-orange); padding: 30px; border-radius: 20px; width: 260px; cursor: pointer; margin: 10px; transition: 0.3s; background: rgba(255,255,255,0.05); }
        .btn-action { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; color: white; width: 100%; }
        input, select { padding: 12px; border: 1px solid #ddd; border-radius: 10px; width: 100%; box-sizing: border-box; margin-top: 8px; font-size: 16px; }
        .q-card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; border-left: 6px solid var(--om-orange); }
        .btn-ans { padding: 15px; border: 1px solid #eee; border-radius: 10px; cursor: pointer; background: white; flex: 1; font-weight: bold; }
        .btn-ans.active { background: var(--om-orange) !important; color: white !important; }
        #sig-canvas { border: 2px dashed #ccc; width: 100%; height: 160px; background: #fff; touch-action: none; border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="home-view">
        <img src="https://i.ibb.co/v4m0YmH/One-Mobility.png" height="80">
        <div id="qrcode" style="background:white; padding:10px; border-radius:10px; margin: 20px 0;"></div>
        <div class="main-btn" onclick="showSection('setup-view')"><h2>OPÉRATEUR</h2><p>Lancer l'audit</p></div>
    </div>

    <div id="setup-view" class="hidden">
        <header><div>Identification</div><button onclick="location.reload()">Retour</button></header>
        <div class="container">
            <div class="card">
                <label>Matricule</label><input id="mat" type="number">
                <label>Nom & Prénom</label><input id="nom" type="text">
                <label>Module</label>
                <select id="theme_select">
                    <option value="Sécurité">Sécurité</option>
                    <option value="Qualité">Qualité</option>
                    <option value="Maintenance">Maintenance</option>
                </select>
                <button class="btn-action" style="background:var(--om-orange); margin-top:20px" onclick="startQuiz()">COMMENCER</button>
            </div>
        </div>
    </div>

    <div id="quiz-view" class="hidden">
        <header><div id="active-theme"></div></header>
        <div class="container">
            <div id="questions-list"></div>
            <div class="card">
                <label><b>Signature :</b></label>
                <canvas id="sig-canvas"></canvas>
            </div>
            <button id="submit-btn" class="btn-action" style="background:var(--success)" onclick="submitTest()">VALIDER ET ENVOYER</button>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Remplacez ce lien par votre lien "Exécuter" (https://script.google.com/macros/s/AKfycbyUlz2xax8NpvzCPFTtjFh8fIl1uPnk1T9HhyGOvwbiUpzxWTJq2L24s7YxVuok4xTdTA/exec) obtenu via Apps Script
        const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1Ky0apw_4lvqqHqB3XkKKymVZRnYEzoN3_wdfO_EMnlU/edit?usp=sharing"; 

        const QUESTIONS = [
            {f: "Le port des EPI est-il obligatoire ?", a: "هل ارتداء معدات الوقاية إلزامي؟", r: true},
            {f: "Peut-on fumer dans la zone de production ?", a: "هل يمكن التدخين في منطقة الإنتاج؟", r: false}
        ];

        let userAnswers = [], isSigned = false;
        let canvas, ctx;

        function showSection(id) {
            document.querySelectorAll('body > div').forEach(d => d.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function startQuiz() {
            if(!document.getElementById('nom').value || !document.getElementById('mat').value) return alert("Remplir nom et matricule");
            showSection('quiz-view');
            document.getElementById('active-theme').innerText = document.getElementById('theme_select').value;
            renderQuestions();
            initSig();
        }

        function renderQuestions() {
            document.getElementById('questions-list').innerHTML = QUESTIONS.map((q, i) => `
                <div class="q-card">
                    <p>${q.f} <br> <small>${q.a}</small></p>
                    <div style="display:flex; gap:10px">
                        <button class="btn-ans" id="v-${i}" onclick="setAns(${i},true)">VRAI</button>
                        <button class="btn-ans" id="f-${i}" onclick="setAns(${i},false)">FAUX</button>
                    </div>
                </div>`).join('');
        }

        function setAns(i, v) {
            userAnswers[i] = v;
            document.getElementById(`v-${i}`).style.background = v ? 'orange' : 'white';
            document.getElementById(`f-${i}`).style.background = !v ? 'orange' : 'white';
        }

        function initSig() {
            canvas = document.getElementById('sig-canvas');
            ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            let drawing = false;
            canvas.addEventListener("touchstart", (e) => { drawing = true; isSigned = true; ctx.beginPath(); });
            canvas.addEventListener("touchmove", (e) => {
                if(!drawing) return;
                let r = canvas.getBoundingClientRect();
                ctx.lineTo(e.touches[0].clientX - r.left, e.touches[0].clientY - r.top);
                ctx.stroke();
            });
            canvas.addEventListener("touchend", () => drawing = false);
        }

        async function submitTest() {
            if(userAnswers.length < QUESTIONS.length || !isSigned) return alert("Répondez à tout et signez");
            
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Envoi en cours...";

            let correct = userAnswers.filter((a, i) => a === QUESTIONS[i].r).length;
            let score = Math.round((correct / QUESTIONS.length) * 100);

            const data = {
                date: new Date().toLocaleString(),
                mat: document.getElementById('mat').value,
                nom: document.getElementById('nom').value,
                theme: document.getElementById('theme_select').value,
                score: score
            };

            try {
                await fetch(GOOGLE_SHEET_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                });
                alert("BRAVO " + data.nom + " !\nScore : " + score + "% \nRésultat enregistré dans le Google Sheet.");
                location.reload();
            } catch (e) {
                alert("Erreur lors de l'envoi.");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
